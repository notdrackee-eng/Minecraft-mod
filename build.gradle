
plugins {
    id 'fabric-loom' version '1.13.6'
}

version = '1.0.0'
group = 'com.minecrart'

base {
    archivesName = 'minecrart-mod'
}

repositories {
    maven {
        url = 'https://maven.terraformersmc.com/'
    }
}

dependencies {
    minecraft 'com.mojang:minecraft:1.21.11'
    mappings 'net.fabricmc:yarn:1.21.11+build.3:v2'
    modImplementation 'net.fabricmc:fabric-loader:0.18.3'
    modCompileOnly 'com.terraformersmc:modmenu:17.0.1'
    modImplementation 'net.fabricmc.fabric-api:fabric-api:0.141.1+1.21.11'
}

tasks.withType(JavaCompile).configureEach {
    options.release = 21
    options.encoding = 'UTF-8'
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(21)
    withSourcesJar()
}
